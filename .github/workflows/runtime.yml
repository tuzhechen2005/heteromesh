name: Numerical runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_runtime.py tests/test_runtime_torch.py -q -rs
