name: Selected weight loader
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: weight-loader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  weight-loader-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU loader dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/weight-loader.txt '.[test]'
      - name: Execute real safetensors loading of self-owned fixtures
        run: python -m pytest tests/test_weight_loader.py -q -rs
