name: H3 operator structure
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  h3-cpu-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional pinned source runtime without model weights
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/h3-runtime.txt '.[test]'
      - name: Verify real upstream block import and identity
        run: python -c 'from heteromesh.h3_runtime import verify_upstream; print(verify_upstream())'
      - name: Execute actual upstream operators with self-owned synthetic weights
        run: python -m pytest tests/test_h3_runtime.py tests/test_h3_metadata.py -q -rs
