name: Development artifacts
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0
      - name: Build and verify clean wheel and source installations
        run: python tools/development_artifacts.py --output-dir dist-development --commit "${{ github.event.pull_request.head.sha || github.sha }}" --platform "${{ matrix.os }}"
      - uses: actions/upload-artifact@v4
        with:
          name: heteromesh-development-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.os }}
          path: |
            dist-development/*.whl
            dist-development/*.tar.gz
            dist-development/development-manifest.json
          if-no-files-found: error
          retention-days: 14
