[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heteromesh"
version = "0.1.0"
description = "Heterogeneous local model inference research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
packages = ["heteromesh", "heteromesh.schemas"]
package-dir = {heteromesh = "src/heteromesh", "heteromesh.schemas" = "schemas"}

[tool.setuptools.package-data]
"heteromesh.schemas" = ["*.json"]
